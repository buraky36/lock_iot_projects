[env]
platform = espressif32@6.9.0
board = esp32dev 
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions.csv
upload_port = COM11
monitor_port = COM11
debug_port = COM11

[env:pin_qr]
build_flags = -DCOMPILE_HW_VERSION=1

[env:pin_rfid]
build_flags = -DCOMPILE_HW_VERSION=2

[env:rfid_only]
build_flags = -DCOMPILE_HW_VERSION=3